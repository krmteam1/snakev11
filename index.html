<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Espaço Relax — Jogo da Cobrinha</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #1a2c26;
    color: #eef3f0;
    font-family: system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .app-container {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 500px;
    margin: 0 auto;
    padding: 12px 16px;
  }

  header {
    text-align: center;
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    padding: 0 5px;
  }

  h1 {
    font-size: clamp(20px, 5vh, 28px);
    text-align: left;
  }

  .status-container {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .info {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }

  #pontos, #nivel {
    font-size: clamp(14px, 2.5vh, 18px);
    font-weight: 500;
  }

  #nivel {
    color: #f2c94c;
    transition: transform 0.2s ease;
  }

  #btn-mudo {
    background: #2f4d44;
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #c8e2d9;
  }
  #btn-mudo:active { background: #406b60; }

  main {
    flex-grow: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 0;
    margin-bottom: 12px;
  }

  #tela {
    aspect-ratio: 1 / 1;
    width: 100%;
    max-height: 100%;
    background: #27403b;
    border-radius: 20px;
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    grid-template-rows: repeat(12, 1fr);
    gap: 2px;
    padding: 6px;
    touch-action: none;
  }

  .celula { background: #27403b; border-radius: 4px; }
  .cobra { background: #72b972; border-radius: 6px; }
  .cabeca { background: #44aa44; border-radius: 6px; position: relative; }
  .cabeca::before, .cabeca::after {
    content: ""; position: absolute; width: 22%; height: 22%;
    background: #000; border-radius: 50%; top: 24%;
  }
  .cabeca::before { left: 24%; }
  .cabeca::after { right: 24%; }
  .comida { background: #f2c94c; border-radius: 6px; }

  section#controles {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding-bottom: env(safe-area-inset-bottom, 8px);
  }

  #controle-cruz {
    display: grid;
    grid-template-columns: repeat(3, clamp(55px, 16vw, 75px));
    grid-template-rows: repeat(3, clamp(55px, 16vw, 75px));
    gap: clamp(6px, 2vw, 10px);
  }

  #btn-cima  { grid-column: 2; grid-row: 1; }
  #btn-esq   { grid-column: 1; grid-row: 2; }
  #btn-dir   { grid-column: 3; grid-row: 2; }
  #btn-baixo { grid-column: 2; grid-row: 3; }

  .btn-dir {
    width: 100%; height: 100%;
    border: none;
    background: #406b60;
    color: #fff;
    border-radius: 16px;
    font-size: clamp(22px, 6vw, 30px);
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .btn-dir:active { background: #528578; }

  #botoes-base {
    display: flex;
    justify-content: center;
    gap: 10px;
    width: 100%;
  }

  /* Estilos unificados para botões e links-botão */
  button, #apoio {
    border: none;
    border-radius: 14px;
    font-size: clamp(14px, 3.5vw, 16px);
    cursor: pointer;
    font-weight: 500;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Link de Apoio (LivePix) */
  #apoio {
    background: #2f4d44; 
    color: #c8e2d9;
    padding: 12px 10px;
    flex: 1;
    max-width: 140px;
  }
  #apoio:active { background: #406b60; }

  #iniciar, #recomecar {
    background: #44aa44;
    color: #fff;
    padding: 12px 20px;
    font-weight: bold;
    flex: 1;
    max-width: 180px;
    transition: background 0.2s;
  }
  
  #iniciar:active, #recomecar:active {
    background: #368c36;
  }

  .oculto {
    display: none !important;
  }
</style>
</head>
<body>
  
  <div class="app-container">
    <header>
      <h1>Espaço Relax</h1>
      <div class="status-container">
        <div class="info">
          <div id="pontos">Pontos: 0</div>
          <div id="nivel">Nível: 1</div>
        </div>
        <button id="btn-mudo" type="button" title="Ligar/Desligar Som">🔊</button>
      </div>
    </header>

    <main>
      <div id="tela"></div>
    </main>

    <section id="controles">
      <div id="controle-cruz">
        <button id="btn-cima"  class="btn-dir" type="button">↑</button>
        <button id="btn-esq"   class="btn-dir" type="button">←</button>
        <button id="btn-dir"   class="btn-dir" type="button">→</button>
        <button id="btn-baixo" class="btn-dir" type="button">↓</button>
      </div>

      <div id="botoes-base">
        <!-- Link do LivePix adicionado como âncora para máxima compatibilidade -->
        <a href="https://livepix.gg/tvkrm" target="_blank" rel="noopener noreferrer" id="apoio">💛 Apoiar</a>
        
        <button id="iniciar" type="button">▶ Iniciar</button>
        <button id="recomecar" type="button" class="oculto">🔄 Recomeçar</button>
      </div>
    </section>
  </div>

<script>
(() => {
  "use strict";

  const TAMANHO = 12;
  const tela      = document.getElementById("tela");
  const elPts     = document.getElementById("pontos");
  const elNivel   = document.getElementById("nivel");
  const elIniciar = document.getElementById("iniciar");
  const elRec     = document.getElementById("recomecar");
  const elMudo    = document.getElementById("btn-mudo");

  let cobra, dir, dirPendente, comida, pontos, nivel, parado, intervalo, velocidade;
  let mudo = false;

  /* =========================================
     SISTEMA DE ÁUDIO (WEB AUDIO API)
     ========================================= */
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playTone(freq, type, duration, vol = 0.1, delay = 0) {
    if (!audioCtx || mudo) return;
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(audioCtx.currentTime + delay);
    osc.stop(audioCtx.currentTime + delay + duration);
  }

  const SFX = {
    move: () => playTone(300, 'square', 0.03, 0.03),
    eat: () => playTone(800, 'sine', 0.1, 0.1),
    levelUp: () => {
      playTone(400, 'sine', 0.1, 0.1);
      playTone(600, 'sine', 0.1, 0.1, 0.1);
      playTone(800, 'sine', 0.2, 0.1, 0.2);
    },
    gameOver: () => {
      playTone(300, 'sawtooth', 0.3, 0.1);
      playTone(150, 'sawtooth', 0.6, 0.1, 0.3);
    }
  };
  /* ========================================= */

  function novaComida() {
    const livres = [];
    for (let y = 0; y < TAMANHO; y++) {
      for (let x = 0; x < TAMANHO; x++) {
        if (!cobra.some(p => p.x === x && p.y === y)) livres.push({ x, y });
      }
    }
    if (livres.length === 0) return null;
    return livres[Math.floor(Math.random() * livres.length)];
  }

  function desenhar() {
    const frag = document.createDocumentFragment();
    for (let y = 0; y < TAMANHO; y++) {
      for (let x = 0; x < TAMANHO; x++) {
        const d = document.createElement("div");
        d.className = "celula";
        if (x === cobra[0].x && y === cobra[0].y) {
          d.classList.add("cabeca");
        } else if (cobra.some(p => p.x === x && p.y === y)) {
          d.classList.add("cobra");
        } else if (comida && x === comida.x && y === comida.y) {
          d.classList.add("comida");
        }
        frag.appendChild(d);
      }
    }
    tela.replaceChildren(frag);
    elPts.textContent = "Pontos: " + pontos;
    elNivel.textContent = "Nível: " + nivel;
  }

  function prepararJogo() {
    clearInterval(intervalo);
    cobra = [{ x: 10, y: 6 }, { x: 9, y: 6 }, { x: 8, y: 6 }];
    dir = { dx: 1, dy: 0 };
    dirPendente = null;
    pontos = 0;
    nivel = 1;
    velocidade = 350;
    parado = true;
    comida = novaComida();
    desenhar();
  }

  function iniciarJogo() {
    initAudio();
    prepararJogo();
    parado = false;
    intervalo = setInterval(passo, velocidade);
    
    elIniciar.textContent = "▶ Iniciar";
    elIniciar.classList.add("oculto");
    elRec.classList.remove("oculto");
  }

  function mover(entrada) {
    if (parado || dirPendente) return;
    let nova;
    if (entrada === "cima")  nova = { dx: 0,  dy: -1 };
    else if (entrada === "baixo") nova = { dx: 0,  dy: 1 };
    else if (entrada === "esq")   nova = { dx: -1, dy: 0 };
    else if (entrada === "dir")   nova = { dx: 1,  dy: 0 };
    else return;

    if (nova.dx === dir.dx && nova.dy === dir.dy) return;
    if (nova.dx === -dir.dx && nova.dy === -dir.dy) return;
    
    dirPendente = nova;
    SFX.move();
  }

  function passo() {
    if (parado) return;
    if (dirPendente) {
      dir = dirPendente;
      dirPendente = null;
    }
    const cab = { x: cobra[0].x + dir.dx, y: cobra[0].y + dir.dy };

    if (cab.x < 0 || cab.x >= TAMANHO || cab.y < 0 || cab.y >= TAMANHO) {
      return fimDeJogo();
    }
    if (cobra.some(p => p.x === cab.x && p.y === cab.y)) {
      return fimDeJogo();
    }

    cobra.unshift(cab);

    if (comida && cab.x === comida.x && cab.y === comida.y) {
      pontos += 10;
      SFX.eat();
      
      if (pontos % 50 === 0) {
        nivel++;
        SFX.levelUp();
        velocidade = Math.max(120, velocidade - 25);
        clearInterval(intervalo);
        if(!parado) intervalo = setInterval(passo, velocidade);
        
        elNivel.style.transform = "scale(1.3)";
        setTimeout(() => { elNivel.style.transform = "scale(1)"; }, 300);
      }

      comida = novaComida();
      if (!comida) {
        desenhar();
        return fimDeJogo("Você completou o tabuleiro! 🏆");
      }
    } else {
      cobra.pop();
    }
    desenhar();
  }

  function fimDeJogo(msg) {
    parado = true;
    clearInterval(intervalo);
    desenhar();
    SFX.gameOver();
    
    setTimeout(() => {
      alert((msg || "Fim de jogo!") + "\nPontuação: " + pontos + "\nNível Alcançado: " + nivel);
      
      elIniciar.textContent = "▶ Jogar Novamente";
      elIniciar.classList.remove("oculto");
      elRec.classList.add("oculto");
    }, 500);
  }

  elMudo.addEventListener("click", () => {
    mudo = !mudo;
    elMudo.textContent = mudo ? "🔇" : "🔊";
    if (!mudo) {
      initAudio();
      SFX.move();
    }
  });

  document.getElementById("btn-cima").addEventListener("click",  () => mover("cima"));
  document.getElementById("btn-baixo").addEventListener("click", () => mover("baixo"));
  document.getElementById("btn-esq").addEventListener("click",   () => mover("esq"));
  document.getElementById("btn-dir").addEventListener("click",   () => mover("dir"));

  elIniciar.addEventListener("click", iniciarJogo);
  elRec.addEventListener("click", iniciarJogo);

  const TECLAS = {
    arrowup: "cima",    w: "cima",
    arrowdown: "baixo", s: "baixo",
    arrowleft: "esq",   a: "esq",
    arrowright: "dir",  d: "dir"
  };

  document.addEventListener("keydown", (e) => {
    const cmd = TECLAS[e.key.toLowerCase()];
    if (!cmd) return;
    e.preventDefault();
    mover(cmd);
  });

  let toqueIni = null;
  tela.addEventListener("touchstart", (e) => {
    const t = e.changedTouches[0];
    toqueIni = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  tela.addEventListener("touchend", (e) => {
    if (!toqueIni) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - toqueIni.x;
    const dy = t.clientY - toqueIni.y;
    toqueIni = null;

    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) mover(dx > 0 ? "dir" : "esq");
    else                             mover(dy > 0 ? "baixo" : "cima");
  }, { passive: true });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      clearInterval(intervalo);
    } else if (!parado) {
      clearInterval(intervalo);
      intervalo = setInterval(passo, velocidade);
    }
  });

  prepararJogo();

})();
</script>
</body>
</html>
